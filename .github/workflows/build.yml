name: Build

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  Configuration: Release
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACT:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - name: Set path for nektos/act
        if: ${{ runner.os == 'Windows' && env.ACT }}
        run: echo "C:\Program Files\Git\bin" >> $GITHUB_PATH
        shell: '"C:\Program Files\Git\bin\bash.exe" -c {0}'

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # avoid shallow clone so nbgv can do its work.

      - name: Setup .NET
        if: ${{ runner.os != 'Windows' || !env.ACT }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      # Reads the version to install from the packageManager field of package.json. Only a
      # Windows job under act skips it: that runs on the host, which has pnpm already, while
      # the act image for Linux does not.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        if: ${{ runner.os != 'Windows' || !env.ACT }}

      - run: pnpm install --frozen-lockfile

      - name: Run pre-commit hooks
        run: bash $GITHUB_WORKSPACE/.husky/pre-commit normal

      # https://github.com/actions/cache/blob/main/examples.md
      - uses: actions/cache@v5
        if: ${{ !env.ACT }}
        with:
          path: ~/.nuget/packages
          # Versions live in Directory.Packages.props, and which packages each project
          # asks for lives in the project files. There are no lock files to hash.
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        run: dotnet test --configuration Release --no-build
      - name: Pack
        run: dotnet pack --configuration Release --no-build

      # The tests compile the core from source. The consumers build from the packages instead,
      # the way anyone who installs them does, which catches what packing gets wrong.
      - name: Build the consumers of the packages
        run: dotnet build tests/Consumers/Consumers.slnx --configuration Release

      - name: Upload artifacts (.nupkg)
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v5
        with:
          name: packages
          path: artifacts/package/release/
          retention-days: 5

  sign:
    needs: build
    # Skip for outside contributors: fork PRs have no access to signing/publish
    # secrets, so the release pipeline can't do anything useful for them.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Download Package artifact
        uses: actions/download-artifact@v5
        with:
          name: packages
          path: packages

      - name: Sign
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_SIGNER_CLIENT_SECRET }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_SIGNER_CLIENT_ID }}
        if: ${{ env.AZURE_CLIENT_SECRET != '' && github.ref == 'refs/heads/master' }}
        # dnx runs the tool without installing it. The version stays pinned: the thing
        # signing the release should not change without someone choosing to change it.
        # --trust-signing-root is required on Linux: Trusted Signing issues from Microsoft
        # Identity Verification Root CA 2020, which Linux trust stores do not carry, and
        # without the flag this step fails with only "Certificate chain validation failed".
        run: |
          dotnet dnx SignUniversal.Cli@1.0.34 --yes sign packages/*.nupkg --trust-signing-root \
            --trusted-signing-endpoint "${{ secrets.TRUSTED_SIGNING_ENDPOINT }}" \
            --trusted-signing-account "${{ secrets.TRUSTED_SIGNING_ACCOUNT }}" \
            --trusted-signing-certificate-profile "${{ secrets.TRUSTED_SIGNING_CERTIFICATE_PROFILE }}"

      # Catches a signing step which quietly produced nothing usable, while the packages can
      # still be thrown away.
      - name: Verify signature
        env:
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_SIGNER_CLIENT_SECRET }}
        if: ${{ env.AZURE_CLIENT_SECRET != '' && github.ref == 'refs/heads/master' }}
        run: dotnet nuget verify packages/*.nupkg --all

      - name: Upload artifacts (.nupkg)
        uses: actions/upload-artifact@v5
        with:
          name: packages-signed
          path: packages/
          retention-days: 5

  publish:
    needs: sign
    # Publishing happens only when the workflow is run by hand on master.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the tag and GitHub Release
    defaults:
      run:
        shell: bash

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Download Package artifact
        uses: actions/download-artifact@v5
        with:
          name: packages-signed

      # Both packages come out of one build, so they share a version.
      - name: Determine the version
        id: version
        run: |
          pkg=$(ls Zomp.MethodCloning.[0-9]*.nupkg | head -1)
          version=${pkg#Zomp.MethodCloning.}
          echo "version=${version%.nupkg}" >> $GITHUB_OUTPUT

      - name: Push to NuGet
        env:
          NUGET_PUSH_KEY: ${{ secrets.NUGET_PUSH_KEY }}
        run: dotnet nuget push "*.nupkg" -s https://api.nuget.org/v3/index.json -k "$NUGET_PUSH_KEY"

      # Prepared but not announced. NuGet has accepted the upload and nothing more; it still
      # validates the signature and scans the packages, and may reject them at that stage.
      - name: Draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # gh infers the repo from this when no checkout is present
          VERSION: ${{ steps.version.outputs.version }}
        # A version with a prerelease label, such as 1.0.20-alpha, is released as a prerelease,
        # which GitHub does not mark as the latest release.
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease)
          fi

          gh release create "v$VERSION" \
            --draft \
            "${prerelease[@]}" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes \
            ./*.nupkg

      - name: Wait for NuGet to finish validating
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for id in zomp.methodcloning zomp.methodcloning.variants; do
            available=0
            for _ in $(seq 1 40); do
              if curl -s "https://api.nuget.org/v3-flatcontainer/$id/index.json" | grep -q "\"$VERSION\""; then
                echo "$id $VERSION is available on NuGet"
                available=1
                break
              fi

              sleep 30
            done

            if [ "$available" != 1 ]; then
              echo "::error::$id $VERSION was accepted by NuGet but has not become available within 20 minutes. The release is drafted and can be published once it appears."
              exit 1
            fi
          done

      # The packages are installable, so the release can be announced. This is also what
      # creates the tag, which a draft release holds but does not push.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release edit "v$VERSION" --draft=false
